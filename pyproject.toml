[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "technical_drawings_for_agents"
version = "0.1.0"
description = "Engineering drawings as data for AI agents: one JSON drawing document gives a dimensioned SVG, PDF and DXF sheet, to a published standard."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "African River Corridors Limited" }]
keywords = ["ai-agents", "engineering", "drawings", "svg", "dxf", "cad", "as-code"]
dependencies = [
    "jsonschema>=4.18",
    "ezdxf>=1.4",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# DWG ingest extras: PDF cropping in the ingest pipeline. (ODA File Converter
# and LibreOffice are external binaries, installed separately, not pip deps.)
ingest = ["PyMuPDF>=1.23", "numpy>=1.24"]
dev = ["pytest>=7.0", "ruff>=0.5", "pypdf>=4.0", "Pillow>=10.0", "jsonschema>=4.18", "fonttools>=4.40"]

[project.urls]
Homepage = "https://github.com/African-River-Corridors/technical_drawings_for_agents"
Issues = "https://github.com/African-River-Corridors/technical_drawings_for_agents/issues"

[project.scripts]
technical_drawings_for_agents = "technical_drawings_for_agents.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/technical_drawings_for_agents"]

# The data files of the Drawing Format Standard, so that an installed wheel finds them (dfs/resources.py).
[tool.hatch.build.targets.wheel.force-include]
"docs/standard/schema/drawing-document-1.0.schema.json" = "technical_drawings_for_agents/dfs/data/schema/drawing-document-1.0.schema.json"
"docs/standard/schema/symbol-library-1.0.schema.json" = "technical_drawings_for_agents/dfs/data/schema/symbol-library-1.0.schema.json"
"docs/standard/schema/title-block-template-1.0.schema.json" = "technical_drawings_for_agents/dfs/data/schema/title-block-template-1.0.schema.json"
"docs/standard/data" = "technical_drawings_for_agents/dfs/data/data"
"docs/standard/conformance" = "technical_drawings_for_agents/dfs/data/conformance"

[tool.ruff]
line-length = 100
