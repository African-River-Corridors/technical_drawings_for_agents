channel:
  bed_width_m: 1.20        # nominal invert width
  depth_m: 1.00            # nominal channel depth (invert to top of lining)
  side_slope_h_to_v: 1.5   # horizontal:vertical batter (1.5H:1V)
  lining_thickness_m: 0.20 # nominal concrete lining thickness
  freeboard_m: 0.25        # nominal freeboard above design water level
