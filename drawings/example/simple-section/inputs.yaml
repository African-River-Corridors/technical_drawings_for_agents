# Design-basis parameters the generator reads (all metres).
#
# PROVENANCE NOTE (standard, non-negotiable): these are NOMINAL, ILLUSTRATIVE
# concept values chosen only to demonstrate the toolkit. They are NOT surveyed
# or engineered dimensions. Any value that must come from a survey or supplier
