name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System dependencies
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,plot,verify]'
      - name: Confirm the package under test is this checkout
        run: python -c "import technical_drawings_for_agents as m; print(m.__file__)"
      - name: Tests
        run: python -m pytest -q

  release-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Embargo terms and machine-local paths
        run: python3 tools/release_guard.py
      - name: gitleaks (tree and history)
        env:
          GITLEAKS_VERSION: 8.18.4
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks detect --source . --redact --verbose
          ./gitleaks detect --source . --no-git --redact --verbose
